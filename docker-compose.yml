version: '3.8'

services:
  ezlinkai:
    image: ye4293xx7/one-api:latest
    container_name: ezlinkai2
    restart: always
    command: --log-dir /app/logs
    ports:
      - "5001:3000"
      # metrics 端点：供同机 one-api-logging 的 prometheus-agent 经
      # host.docker.internal:9099 抓取。公网机务必用防火墙/安全组放行仅内网。
      - "9099:9099"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
      - SQL_DSN=missai:rze@rV53e4BDwyj@tcp(ezlinkai.rwlb.rds-aliyun-america.rds.aliyuncs.com:3306)/ezlinkai2
      - REDIS_CONN_STRING=rediss://ezlink-cache-user-1:sina*9Fgk@k7a8fs@ezlink-pgifdn.serverless.usw1.cache.amazonaws.com:6379
      - SYNC_FREQUENCY=120
      - BATCH_UPDATE_ENABLED=true
      - MEMORY_CACHE_ENABLED=true
      - BATCH_UPDATE_INTERVAL=5
      - SQL_MAX_IDLE_CONNS=50
      - SQL_MAX_OPEN_CONNS=300
      - SQL_MAX_LIFETIME=1800
      - RELAY_TIMEOUT=1800
      - STREAMING_TIMEOUT=600
      # ── metrics 导出（独立端口，不依赖 DB/不被限流，见 common/metrics/server.go）──
      - METRICS_ENABLED=true
      - METRICS_PORT=9099
      # 与 one-api-logging/.env 的 METRICS_TOKEN 必须完全一致；为空时 /metrics 只允许 loopback，
      # 跨容器抓取会 401。生产请用 openssl rand -hex 24 重新生成，勿复用他处泄露过的值。
      - METRICS_TOKEN=31578f6d9eda31169322a2c8b4253e17e37ffb7c3d89c9fd
      # ── 计费日志投递（同一镜像按部署实例配置）──
      - BILL_SHIP_ENABLED=${BILL_SHIP_ENABLED:-false}
      - BILL_SHIP_QUEUE_URL=${BILL_SHIP_QUEUE_URL:-}
      - BILL_SHIP_REGION=${BILL_SHIP_REGION:-}
      - BILL_SHIP_SITE_ID=${BILL_SHIP_SITE_ID:-}
      - BILL_SHIP_LOG_FAILED_BODY=${BILL_SHIP_LOG_FAILED_BODY:-false}
      - BILL_SHIP_BUFFER_SIZE=${BILL_SHIP_BUFFER_SIZE:-10000}
      - BILL_SHIP_BATCH_SIZE=${BILL_SHIP_BATCH_SIZE:-10}
      - BILL_SHIP_BATCH_WAIT_MS=${BILL_SHIP_BATCH_WAIT_MS:-200}
      - BILL_SHIP_SEND_CONCURRENCY=${BILL_SHIP_SEND_CONCURRENCY:-8}
      - BILL_SHIP_SEND_TIMEOUT_SECONDS=${BILL_SHIP_SEND_TIMEOUT_SECONDS:-3}
      - BILL_SHIP_MAX_RETRIES=${BILL_SHIP_MAX_RETRIES:-3}
      # 优先使用实例 IAM Role；非 AWS 主机才通过部署机 .env 注入以下凭证。
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' | awk -F: '{print $2}'" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7
    container_name: one-api-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  redis-data:
